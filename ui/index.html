<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>UAT templates</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 16h24' stroke='%230B7A68' stroke-width='4'/%3E%3Ccircle cx='7' cy='16' r='5' fill='%23fff' stroke='%23142028' stroke-width='3'/%3E%3Ccircle cx='25' cy='16' r='5' fill='%23B65F00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>
  (() => {
    let t = null;
    if (window.__console) { document.documentElement.classList.add("in-console"); t = (window.__prefs || {}).theme; }
    else try { t = localStorage.getItem("uat-deploy:theme"); } catch {}
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root {
  --bar-h: 58px;
  --rail-w: 248px;
  --file-w: clamp(340px, 33vw, 600px);
  --r-s: 6px;
  --r-m: 10px;
  --display: "Red Hat Display", "Red Hat Text", system-ui, sans-serif;
  --text: "Red Hat Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Red Hat Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
/* Colour carries meaning: slate = on your machine, pine = reads UAT or fine, amber = changes UAT, red = a problem. */
:root, :root[data-theme="light"] {
  --paper: #EEF1F0; --sheet: #FFFFFF; --well: #E4E9E7; --hover: #F4F6F5; --ink: #142028; --ink-2: #3F4D57;
  --ink-3: #64727C; --rule: #D5DCDA; --rule-2: #B3BEBB; --local: #4F6475; --safe: #0B7A68; --safe-bg: #E1F2EE;
  --change: #B65F00; --change-bg: #FBEEDD; --bad: #B3261E; --bad-bg: #FBE9E7; --code-key: #134E6F; --code-str: #3C5A2E;
  --code-com: #7A8781; --add-bg: #E3F3EC; --add: #2F8F5B; --mod: #C27C12; --shadow: 0 10px 30px rgba(20, 32, 40, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121213; --sheet: #1C1C1F; --well: #17171A; --hover: #242428; --ink: #ECECEE; --ink-2: #B6B6BC;
    --ink-3: #8B8B93; --rule: #2B2B30; --rule-2: #404047; --local: #9AA7B4; --safe: #3CC0A7; --safe-bg: #16302A;
    --change: #F2A04A; --change-bg: #33240F; --bad: #F2806F; --bad-bg: #3A1A16; --code-key: #8CC8E8;
    --code-str: #B5D49A; --code-com: #7D7D85; --add-bg: #16302A; --add: #52C08A; --mod: #E0A24A;
    --shadow: 0 12px 34px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121213; --sheet: #1C1C1F; --well: #17171A; --hover: #242428; --ink: #ECECEE; --ink-2: #B6B6BC;
  --ink-3: #8B8B93; --rule: #2B2B30; --rule-2: #404047; --local: #9AA7B4; --safe: #3CC0A7; --safe-bg: #16302A;
  --change: #F2A04A; --change-bg: #33240F; --bad: #F2806F; --bad-bg: #3A1A16; --code-key: #8CC8E8;
  --code-str: #B5D49A; --code-com: #7D7D85; --add-bg: #16302A; --add: #52C08A; --mod: #E0A24A;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/1.5 var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 13px; }
code { overflow-wrap: anywhere; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--safe); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------------------------------------------------------- bar */
.bar { position: sticky; top: 0; z-index: 20; height: var(--bar-h); display: flex; align-items: center; gap: 18px; padding: 0 18px; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 600 16px/1 var(--display); white-space: nowrap; }
.mark svg { width: 30px; height: 18px; }
.bar-mid { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.bar-mid .tname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-mid .file { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state { all: unset; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rule-2); }
.state.dirty::before { background: var(--change); }
.state.bad { color: var(--bad); cursor: pointer; }
.state.bad::before { background: var(--bad); }
.state.ok::before { background: var(--safe); }
.bar-actions { display: flex; align-items: center; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border: 1px solid var(--rule-2); border-radius: var(--r-s); background: var(--sheet); cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--hover); border-color: var(--ink-3); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--well); }
.btn.small { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.btn.icon { width: 34px; padding: 0; }
.btn.on { background: var(--well); }

/* ---------------------------------------------------------------- home */
.home { max-width: 1180px; margin: 0 auto; padding: 48px 28px 80px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); gap: 56px; }
.home h1 { font: 600 34px/1.12 var(--display); letter-spacing: -.015em; margin: 0 0 12px; }
.lede { margin: 0 0 32px; color: var(--ink-2); font-size: 15.5px; max-width: 60ch; }
.tpl-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.tpl { border-bottom: 1px solid var(--rule); }
.tpl button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; width: 100%; padding: 20px 6px; cursor: pointer; }
.tpl button:hover { background: var(--hover); }
.tpl button:focus-visible { outline: 2px solid var(--safe); outline-offset: -2px; }
.tpl .t-name { font: 600 19px/1.25 var(--display); }
.tpl .t-id { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); align-self: center; }
.tpl .t-desc { grid-column: 1 / -1; color: var(--ink-2); max-width: 70ch; }
.tpl .t-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--ink-3); }
.t-apps { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--well); color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.empty { padding: 28px 0; color: var(--ink-3); }
.newcard { align-self: start; position: sticky; top: calc(var(--bar-h) + 28px); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-m); padding: 26px; }
.newcard h2 { font: 600 21px/1.2 var(--display); margin: 0 0 6px; }
.newcard > p { margin: 0 0 20px; color: var(--ink-2); }

/* radio cards, used for "start from" and for choices in the forms */
.choices { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 20px 1fr; gap: 2px 10px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--r-s); cursor: pointer; background: var(--sheet); }
.choice:hover { border-color: var(--rule-2); background: var(--hover); }
.choice input { margin: 3px 0 0; accent-color: var(--safe); }
.choice b { font-weight: 600; }
.choice .d { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.choice:has(input:checked) { border-color: var(--safe); background: var(--safe-bg); }
.choice:has(input:checked) .d { color: var(--ink-2); }

/* ---------------------------------------------------------------- editor frame */
.editor { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); height: calc(100vh - var(--bar-h)); }
.editor.with-file { grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--file-w); }
.rail { border-right: 1px solid var(--rule); background: var(--sheet); overflow-y: auto; padding: 18px 10px 24px; display: flex; flex-direction: column; gap: 2px; }
.rail-head { padding: 2px 10px 16px; }
.rail-title { font: 600 18px/1.2 var(--display); word-break: break-word; }
.rail-sub { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.group { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 4px; color: var(--ink-3); font-size: 12.5px; font-weight: 600; }
.group button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; color: var(--ink-2); font-weight: 500; }
.group button:hover { background: var(--well); color: var(--ink); }
.group button:focus-visible { outline: 2px solid var(--safe); }
.nav { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 0 10px; padding: 7px 10px; border-radius: var(--r-s); cursor: pointer; color: var(--ink-2); }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav:focus-visible { outline: 2px solid var(--safe); outline-offset: -2px; }
.nav.on { background: var(--well); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }
.nav .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav small { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
.nav .sub2 { grid-column: 2 / -1; font-size: 12px; color: var(--ink-3); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sdot { width: 8px; height: 8px; border-radius: 50%; }
.sdot.error { background: var(--bad); }
.sdot.warn { background: var(--change); }
.rail-foot { margin-top: auto; padding: 18px 10px 0; font-size: 12.5px; color: var(--ink-3); }

.pane { overflow-y: auto; }
.pane-in { max-width: 840px; margin: 0 auto; padding: 30px 36px 120px; }
.pane-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 8px; }
.pane-head h2 { font: 600 28px/1.15 var(--display); letter-spacing: -.01em; margin: 0; word-break: break-word; }
.pane-head .sub { margin: 6px 0 0; color: var(--ink-3); font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.tools { display: flex; gap: 4px; flex: none; align-items: center; }

.sec { padding: 24px 0 6px; border-top: 1px solid var(--rule); margin-top: 24px; }
.sec:first-of-type { margin-top: 18px; }
.sec h3 { font: 600 17px/1.3 var(--display); margin: 0; }
.about { margin: 2px 0 16px; color: var(--ink-3); max-width: 68ch; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px 18px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .lab { font-size: 13px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field input, .field select, .field textarea, .inp { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--rule-2); border-radius: var(--r-s); background: var(--sheet); transition: border-color .12s, box-shadow .12s; }
.field input[type="radio"], .field input[type="checkbox"] { width: auto; min-height: 0; padding: 0; border: 0; box-shadow: none; flex: none; }
.field textarea { resize: vertical; line-height: 1.5; }
.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--ink-3); }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--safe); box-shadow: 0 0 0 3px color-mix(in srgb, var(--safe) 22%, transparent); }
.field input[readonly] { background: var(--well); color: var(--ink-2); }
.hint { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.hint code { font-size: 12px; background: var(--well); padding: 0 4px; border-radius: 3px; }
.msg { margin: 0; font-size: 12.5px; display: none; }
.field.has-error input, .field.has-error textarea, .field.has-error select, .has-error > .inp { border-color: var(--bad); }
.field.has-error .msg, .has-error > .msg { display: block; color: var(--bad); }
.field.has-warn .msg, .has-warn > .msg { display: block; color: var(--change); }
.field.pulse input, .field.pulse textarea, .field.pulse select { animation: pulse 1.2s ease-out; }
@keyframes pulse { 0% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--safe) 35%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.tag { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.tag.good { background: var(--safe-bg); color: var(--safe); }
.tag.meh { background: var(--change-bg); color: var(--change); }
.tag.found { background: var(--safe-bg); color: var(--safe); font-weight: 500; }

/* fields saved only on this machine */
.here { padding: 14px 16px 16px; border-radius: var(--r-m); background: var(--well); border: 1px dashed var(--rule-2); }
.here-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
.here-h b { font-weight: 600; color: var(--ink); }
.here .field input, .here .field select { background: var(--sheet); }

.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 3px; border-radius: 8px; background: var(--well); }
.seg button { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 6px; color: var(--ink-2); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.seg button:hover { color: var(--ink); }
.seg button:focus-visible { outline: 2px solid var(--safe); }
.seg button.on { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(20, 32, 40, .12); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule-2); background: var(--sheet); font-size: 13px; color: var(--ink-2); }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip:focus-visible { outline: 2px solid var(--safe); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .hint { font-size: 12px; }
.chip.on .hint { color: var(--paper); opacity: .72; }
.chip b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 11px; font-weight: 700; }
.chip.ph { font-family: var(--mono); font-size: 12.5px; height: 24px; }

details.more { margin-top: 16px; }
details.more > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; font-weight: 500; padding: 4px 0; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor; transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
details.more[open] > summary::before { transform: rotate(45deg); }
details.more > summary:hover { color: var(--ink); }
.more-b { margin-top: 12px; padding-top: 14px; border-top: 1px dashed var(--rule); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-s); background: var(--well); color: var(--ink-2); margin-bottom: 18px; }
.note.ok { background: var(--safe-bg); color: var(--ink); }
.note.ok svg { color: var(--safe); margin-top: 2px; }
.note.warn { background: var(--change-bg); color: var(--ink); }
.note .btn { margin-left: auto; }

/* problems for the page shown */
.pbanner { margin: 16px 0 4px; padding: 12px 16px; border-radius: var(--r-m); background: var(--bad-bg); color: var(--ink); }
.pbanner b { color: var(--bad); font-weight: 600; }
.pbanner ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.pbanner button { all: unset; cursor: pointer; font-size: 13px; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--bad) 50%, transparent); text-underline-offset: 3px; }
.pbanner button:hover { color: var(--bad); }
.pbanner button:focus-visible { outline: 2px solid var(--safe); }

/* ---------------------------------------------------------------- summary rows of an app */
.srow { border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--sheet); margin-top: 10px; scroll-margin-top: 16px; }
.srow-h { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 150px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; border-radius: var(--r-m); }
.srow-h:hover { background: var(--hover); }
.srow-h:focus-visible { outline: 2px solid var(--safe); outline-offset: -2px; }
.srow-t { font-weight: 600; }
.srow-s { color: var(--ink-2); font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow-s code { font-size: 12.5px; }
.srow-s .todo { color: var(--ink-3); font-style: italic; }
.srow-e { color: var(--ink-3); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.srow.open { box-shadow: var(--shadow); border-color: var(--rule-2); }
.srow.open .srow-h { border-bottom: 1px solid var(--rule); border-radius: var(--r-m) var(--r-m) 0 0; }
.srow-b { padding: 18px 18px 20px; }
.srow.is-error { border-color: color-mix(in srgb, var(--bad) 55%, var(--rule)); }
.srow.is-error .srow-t { color: var(--bad); }
.srow.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--safe) 40%, transparent); } 100% { box-shadow: none; } }

/* ---------------------------------------------------------------- the route: what a deploy of this app does */
.route-wrap { margin: 18px 0 18px; padding: 8px 20px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-m); }
.route { list-style: none; margin: 0; padding: 28px 0 6px; display: flex; overflow-x: auto; scrollbar-width: thin; }
.st { --z: var(--local); position: relative; flex: 1 1 0; min-width: 76px; }
.st.z-change { --z: var(--change); }
.st.z-read { --z: var(--safe); }
.st::before { content: ""; position: absolute; top: 10px; left: 0; right: 0; height: 4px; background: var(--z); }
.st:first-child::before { left: 11px; }
.st:last-child::before { right: calc(100% - 11px); }
.st button { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 0 10px 4px 0; cursor: pointer; }
.st button:focus-visible .dot { outline: 2px solid var(--ink); outline-offset: 3px; }
.dot { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; border: 4px solid var(--z); background: var(--sheet); transition: transform .15s; }
.st.z-local .dot, .st.z-change .dot { background: var(--z); }
.st button:hover .dot { transform: scale(1.12); }
.st.is-error .dot { border-style: dashed; border-color: var(--bad); background: var(--bad-bg); }
.st-l { margin-top: 8px; font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.st-d { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.st.is-error .st-d { color: var(--bad); font-family: var(--text); font-size: 12px; }
.hop { flex: 0 0 22px; position: relative; }
.hop::before { content: ""; position: absolute; top: -2px; height: 30px; left: 10px; border-left: 2px dashed var(--ink-3); }
.hop span { position: absolute; left: 0; top: -24px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-3); }

    const out = { ...stripUi(a), deploy: dep, configs: (a.configs || []).map(stripUi) };
    if (style === "none") delete out.build;
    return out;
  });
  return t;
}

/* ------------------------------------------------------------------ issues */
function issueKey(path) {
  const p = [...path];
  if (p[0] === "servers" && typeof p[1] === "string") {
    const i = S.draft.servers.findIndex((s) => s.id === p[1]);
    p[1] = i < 0 ? 0 : i;
  }
  return p.join(".");
}
function indexIssues() {
  S.issues = new Map();
  for (const [kind, list] of [["error", S.errors], ["warn", S.warnings]]) {
    for (const it of list) {
      const k = issueKey(it.path);
      if (!S.issues.has(k)) S.issues.set(k, []);
      S.issues.get(k).push({ ...it, kind });
    }
  }
}
const under = (k, p) => k === p || k.startsWith(p + ".");
function worstAny(prefixes) {
  let worst = null;
  for (const [k, list] of S.issues) {
    if (prefixes.some((p) => under(k, p))) for (const it of list) { if (it.kind === "error") return "error"; worst = "warn"; }
  }
  return worst;
}
const errorsUnder = (prefixes) => S.errors.filter((e) => prefixes.some((p) => under(issueKey(e.path), p)));
function clientIssues() {
  const extra = [];
  const seen = new Map();
  S.draft.servers.forEach((s, i) => {
    if (seen.has(s.id)) extra.push({ path: ["servers", i, "id"], label: `servers[${s.id}].id`, message: "two servers share this id" });
    seen.set(s.id, i);
  });
  S.draft.apps.forEach((a, i) => (a.configs || []).forEach((c, j) => {
    if (c._git === true && !c.git_repo) extra.push({ path: ["apps", i, "configs", j, "git_repo"], label: `apps[${a.id}].configs[${c.id}].git_repo`, message: "enter the git repo folder, or choose No" });
  }));
  return extra;
}

/* ------------------------------------------------------------------ preview */
let previewTimer = null;
function schedulePreview(delay = 200) { clearTimeout(previewTimer); previewTimer = setTimeout(runPreview, delay); }
async function runPreview() {
  const seq = ++S.previewSeq;
  try {
    const res = await api("/api/preview", { template: toFile(S.draft), original_id: S.originalId });
    if (seq !== S.previewSeq || !S.draft) return;
    S.yaml = res.yaml;
    S.errors = [...clientIssues(), ...res.errors];
    S.warnings = res.warnings;
    S.auth = { ...S.auth, ...res.auth };
    indexIssues();
    renderFile(); renderRail(); renderBar(); paintIssues(); renderRoute(); renderBanner(); paintRows();
  } catch (e) { toast(e.message, true); }
}
function changed() { S.dirty = true; renderBar(); renderRail(); renderRoute(); schedulePreview(); }

/* ------------------------------------------------------------------ fields */
function field(o) {
  const v = getAt(S.draft, o.path);
  const id = "f-" + o.path.replace(/\./g, "-");
  const cls = o.mono ? "mono" : "";
  const found = S.wizard?.found?.has(o.path) ? `<span class="tag found">found on the server</span>` : "";
  let input;
  if (o.area) {
    const need = String(v ?? "").split("\n").length + 1;
    input = `<textarea id="${id}" data-bind="${o.path}" rows="${Math.min(Math.max(o.rows || 3, need), 16)}" class="${cls}" placeholder="${esc(o.placeholder || "")}" spellcheck="${o.spell ? "true" : "false"}">${esc(v ?? "")}</textarea>`;
  } else if (o.options) {
    input = `<select id="${id}" data-bind="${o.path}">${o.options.map(([val, lab]) => `<option value="${esc(val)}" ${String(v ?? "") === String(val) ? "selected" : ""}>${esc(lab)}</option>`).join("")}</select>`;
  } else {
    const val = Array.isArray(v) ? v.join(", ") : v ?? "";
    input = `<input id="${id}" type="text" data-bind="${o.path}" ${o.num ? 'data-num="1" inputmode="numeric"' : ""} ${o.csv ? 'data-csv="1"' : ""} class="${cls}" value="${esc(val)}" placeholder="${esc(o.placeholder || "")}" spellcheck="false" autocomplete="off" ${o.readonly ? "readonly" : ""}>`;
  }
  return `<div class="field ${o.wide ? "wide" : ""}" data-issue="${o.path}"><label for="${id}">${esc(o.label)}${found}</label>${input}${o.hint ? `<p class="hint">${o.hint}</p>` : ""}<p class="msg" aria-live="polite"></p></div>`;
}
function localField(o) {
  const id = "l-" + o.kind + "-" + (o.name || "x");
  return `<div class="field ${o.wide ? "wide" : ""}"><label for="${id}">${esc(o.label)}</label>
    <input id="${id}" type="text" class="mono" data-local="${o.kind}" data-lname="${esc(o.name || "")}" ${o.detect ? `data-detect="${esc(o.detect)}"` : ""} value="${esc(o.value || "")}" placeholder="${esc(o.placeholder || "")}" spellcheck="false" autocomplete="off" ${o.disabled ? "disabled" : ""}>
    ${o.hint ? `<p class="hint">${o.hint}</p>` : ""}<p class="msg" aria-live="polite"></p></div>`;
}
/* rarely needed fields, behind a toggle; it opens by itself when one of them has a problem */
function more(key, paths, html, label = "More options") {
  const open = S.more[key] || (worstAny(paths) === "error" && !wizardHidesIssues());
  return `<details class="more" data-more="${key}" ${open ? "open" : ""}><summary>${esc(label)}</summary><div class="more-b">${html}</div></details>`;
}
function wizardHidesIssues() {
  const w = S.wizard;
  return !!(w && S.sel.kind === "app" && S.sel.i === w.i && !w.tried[wizardSteps()[w.step]]);
}
function paintIssues() {
  const hide = wizardHidesIssues();
  $$("[data-issue]").forEach((el) => {
    const list = hide ? [] : S.issues.get(el.dataset.issue) || [];
    const err = list.find((x) => x.kind === "error");
    const w = S.wizard ? null : list.find((x) => x.kind === "warn");
    el.classList.toggle("has-error", !!err);
    el.classList.toggle("has-warn", !err && !!w);
    const m = el.querySelector(":scope > .msg");
    if (m) m.textContent = (err || w)?.message || "";
  });
}

async function createTemplate() {
  const name = $("#n-name").value.trim(), id = slug(name);
  const src = ($("input[name=src]:checked") || {}).value || "";
  const msg = $("#n-msg");
  msg.style.display = "block"; msg.style.color = "var(--bad)";
  if (!name || !id) { msg.textContent = "Give the project a name."; $("#n-name").focus(); return; }
  if (S.boot.templates.some((t) => t.id === id)) { msg.textContent = `A template "${id}" already exists.`; $("#n-name").focus(); return; }
  let draft;
  if (src) {
    const res = await api(`/api/template?id=${encodeURIComponent(src)}`);
    draft = fromFile(res.template);
    draft.id = id; draft.name = name;
  } else {
    draft = blankTemplate(id, name);
  }
  S.draft = draft; S.isNew = true; S.originalId = null; S.baseline = ""; S.dirty = true;
  S.local = { repos: {}, builds: {}, config_dir: "" }; S.auth = {}; S.detect = {}; S.open = {}; S.more = {};
  history.replaceState(null, "", "#draft");
  if (src) {
    S.wizard = null; S.sel = { kind: "overview", i: 0 };
    renderEditor(); runPreview();
    toast(`Filled from ${src}. Change what differs, then save.`);
  } else {
    S.wizard = { i: 0, step: 0, tried: {}, newTemplate: true, found: new Set() };
    S.sel = { kind: "app", i: 0 };
    renderEditor(); runPreview();
  }
}

async function openTemplate(id) {
  try {
    const res = await api(`/api/template?id=${encodeURIComponent(id)}`);
    S.draft = fromFile(res.template); S.isNew = false; S.originalId = id; S.baseline = res.file_text; S.dirty = false;
    S.local = res.local; S.auth = res.auth || {}; S.detect = {}; S.sel = { kind: "overview", i: 0 }; S.wizard = null; S.open = {}; S.more = {};

}

const todo = (t) => `<span class="todo">${t}</span>`;

/* build presets: most apps are one of these */
const PRESETS = [

function presetOf(a) {

  if (/\bmvn\b.*\s-pl\s+\S+/.test(c)) return "module";

  if (/gradle/.test(c)) return "gradle";

const moduleOf = (a) => ((a.build?.command || "").match(/\s-pl\s+(\S+)/) || [])[1] || "";

function guessFormat(path) {

function detectPanel(i) {

  if (r.busy) return `<div class="note"><span class="spin"></span> Looking in <code>${esc(S.draft.apps[i].dir)}</code> on the server…</div>`;
  if (r.error) return `<div class="note warn">Couldn't look in the folder: ${esc(r.error)}</div>`;
  if (r.missing) return `<div class="note warn"><code>${esc(r.dir)}</code> doesn't exist on the server.</div>`;
  const sugs = suggestions(i, r);
  return `<div class="detect"><div class="detect-h"><b>Found in ${esc(r.dir)}</b><span style="display:flex;gap:6px">${sugs.length ? `<button class="btn small" type="button" data-act="sug-all" data-i="${i}">Use all</button>` : ""}<button class="mini" type="button" data-act="detect-close" data-i="${i}" aria-label="Close">${ICON.x}</button></span></div>
    ${sugs.length ? sugs.map((s, n) => { const used = getAt(S.draft, s.path) === s.value; return `<div class="sug ${used ? "used" : ""}"><span class="k">${esc(s.label)}</span><span class="v">${esc(s.value)}</span><button class="btn small" type="button" data-act="sug" data-i="${i}" data-n="${n}" ${used ? "disabled" : ""}>${used ? "In use" : "Use"}</button>${s.why ? `<span class="why">${esc(s.why)}</span>` : ""}</div>`; }).join("")

function suggestions(i, r) {
  const a = S.draft.apps[i], p = `apps.${i}`, out = [];
  const proc = r.procs.find((x) => x.ports.length) || r.procs[0];
  const runningJar = proc ? proc.jar || ((proc.args.match(/-jar\s+(\S+\.jar)/) || [])[1] || "").split("/").pop() : "";
  const starters = startScripts(r);
  const matched = starters.find((s) => runningJar && s.jars.some((j) => j.jar.split("/").pop() === runningJar));
  // several start scripts and none runs the jar that is running now: the person picks, nothing is guessed
  const best = matched || (starters.length === 1 ? starters[0] : null);
  if (best) out.push({ label: "Start", path: `${p}.start`, value: `./${best.name}`, why: best.jars.length ? `runs java -jar ${best.jars[0].jar}${runningJar && best.jars.some((j) => j.jar.split("/").pop() === runningJar) ? ", the jar running now" : ""}` : "starts the app" });
  const stopper = r.scripts.find((s) => s.stops && /stop/i.test(s.name)) || r.scripts.find((s) => s.stops);
  if (stopper) out.push({ label: "Stop", path: `${p}.stop`, value: `./${stopper.name}`, why: "stops the app" });
  const log = best && best.logs[0];
  if (log) out.push({ label: "Log file", path: `${p}.log`, value: log.path, why: log.append ? `${best.name} writes to it` : `${best.name} clears it on every start` });
  const port = proc?.ports[0] || best?.ports[0];
  if (port) out.push({ label: "Port", path: `${p}.port`, value: port, why: proc?.ports.length ? `the running app listens on it` : `set in ${best.name}` });
  if (!port && runningJar) out.push({ label: "Process", path: `${p}.process`, value: runningJar, why: "the running app's jar" });
  if (best && best.jars.length && (a.deploy?.style || "none") !== "custom") {
    out.push({ label: "Going live", path: `${p}.deploy.style`, value: "jar-start-script", why: "its start script runs a jar" });
    out.push({ label: "Script edit", path: `${p}.deploy.edit`, value: best.multiline ? "replace" : "duplicate", why: best.multiline ? "its java command spans several lines" : "its java command is on one line" });
  }
  return out;
}

async function wizNext() {

/* ------------------------------------------------------------------ the file */
function lineDiff(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let x = n - 1; x >= 0; x--) for (let y = m - 1; y >= 0; y--) dp[x][y] = a[x] === b[y] ? dp[x + 1][y + 1] + 1 : Math.max(dp[x + 1][y], dp[x][y + 1]);
  const marks = new Array(m).fill(null), delBefore = new Set();
  let x = 0, y = 0, adds = 0, dels = 0, pendingDel = false;
  while (x < n || y < m) {
    if (x < n && y < m && a[x] === b[y]) { if (pendingDel) { delBefore.add(y); pendingDel = false; } x++; y++; }
    else if (y < m && (x === n || dp[x][y + 1] >= dp[x + 1][y])) { marks[y] = pendingDel ? "mod" : "add"; if (pendingDel) { pendingDel = false; dels--; adds--; } adds++; y++; }
    else { dels++; pendingDel = true; x++; }
  }
  if (pendingDel) delBefore.add(m);
  const modCount = marks.filter((v) => v === "mod").length;
  return { marks, delBefore, adds: adds + modCount, dels: dels + modCount };
}
function hl(line) {
  if (/^\s*#/.test(line)) return `<span class="c">${esc(line)}</span>`;
  const m = line.match(/^(\s*)(- )?([^\s:#][^:#]*?)(:)(\s+.*|)$/);
  if (m) return `${esc(m[1])}${m[2] ? `<span class="p">- </span>` : ""}<span class="k">${esc(m[3])}</span><span class="p">:</span>${m[5] ? `<span class="s">${esc(m[5])}</span>` : ""}`;
  const l = line.match(/^(\s*)(- )(.*)$/);
  if (l) return `${esc(l[1])}<span class="p">- </span><span class="s">${esc(l[3])}</span>`;
  return `<span class="s">${esc(line)}</span>`;
}
function highlight(lines) {
  let block = -1;
  return lines.map((l) => {
    const ind = l.match(/^\s*/)[0].length;
    if (block >= 0 && (l.trim() === "" || ind > block)) return `<span class="s">${esc(l)}</span>`;
    block = /:\s*\|[-+]?\s*$/.test(l) ? ind : -1;
    return hl(l);
  });
}
function renderFile() {
  const el = $("#file");
  if (!el || !S.draft) return;
  const lines = S.yaml ? S.yaml.replace(/\n$/, "").split("\n") : [];
  const base = S.baseline ? S.baseline.replace(/\n$/, "").split("\n") : [];
  const diff = S.baseline ? lineDiff(base, lines) : { marks: [], delBefore: new Set(), adds: lines.length, dels: 0 };
  const top = $(".code", el)?.scrollTop || 0;
  el.innerHTML = `
    <div class="file-h"><span class="fname" title="${esc(S.boot.templates_dir)}/${esc(S.draft.id)}.yml">templates/${esc(S.draft.id || "…")}.yml</span>
      <span class="diffstat">${S.isNew ? `<span class="a">new file</span>` : diff.adds || diff.dels ? `<span class="a">+${diff.adds}</span> <span class="d">−${diff.dels}</span>` : "no changes"}</span>
      <button class="mini" type="button" data-act="copy-yaml" title="Copy the file" aria-label="Copy the file">${ICON.copy}</button>
      <button class="mini" type="button" data-act="toggle-file" title="Hide the file" aria-label="Hide the file">${ICON.x}</button></div>
    <pre class="code" aria-label="Template file">${highlight(lines).map((h, n) => `<div class="ln ${diff.marks[n] || ""} ${diff.delBefore.has(n) ? "delb" : ""}"><span>${h || " "}</span></div>`).join("")}</pre>`;
  const code = $(".code", el);

}

/* ------------------------------------------------------------------ server calls */
async function save() {
  if (!S.draft || S.saving) return;
  if (S.wizard) { toast("Finish or cancel the setup first.", true); select("app", S.wizard.i); return; }
  clearTimeout(previewTimer);
  await runPreview();
  if (S.errors.length) { toast(`${S.errors.length} thing${S.errors.length === 1 ? "" : "s"} to fix first.`, true); gotoIssue(issueKey(S.errors[0].path)); return; }
  S.saving = true; renderBar();
  try {
    const res = await api("/api/save", { template: toFile(S.draft), original_id: S.originalId });
    const created = S.isNew;
    S.baseline = res.yaml; S.yaml = res.yaml; S.isNew = false; S.originalId = res.id; S.dirty = false;
    S.boot.templates = res.templates;
    history.replaceState(null, "", `#edit/${res.id}`);
    toast(`${created ? "Created" : "Saved"} templates/${res.id}.yml`);
    renderPane(); renderFile();
  } catch (e) {
    if (e.data?.errors) { S.errors = e.data.errors; indexIssues(); paintIssues(); renderBanner(); }
    toast(e.message, true);
  } finally { S.saving = false; renderBar(); renderRail(); }
}

}

  try {
    const r = await api("/api/check", { template: toFile(S.draft) });
    const fails = r.groups.reduce((n, g) => n + g.items.filter((x) => x.status === "FAIL").length, 0);
    $(".drawer-b").innerHTML = r.error && !r.groups.length ? `<div class="verdict bad">${esc(r.error)}</div>`
      : `<div class="verdict ${fails || !r.ok ? "bad" : "ok"}">${fails ? `${fails} check${fails === 1 ? "" : "s"} failed` : r.ok ? "Everything the template names exists on the servers." : esc(r.error || "The check did not finish.")}</div>
         ${r.groups.map((g) => `<div class="cgroup"><h4>${esc(g.server)}<span>${esc(g.target)}</span></h4>${g.items.map((x) => `<div class="citem"><span class="s ${x.status}">${x.status}</span><span class="a">${esc(x.app)}</span><span class="t">${esc(x.text)}</span></div>`).join("")}</div>`).join("")}`;
  } catch (e) { $(".drawer-b").innerHTML = `<div class="verdict bad">${esc(e.message)}</div>`; }
}

async function detect(i) {
  const a = S.draft.apps[i];
  if (!a.server || !a.dir) { toast("Pick the server and enter the folder first.", true); return; }
  S.detect[i] = { busy: true };
  if (S.sel.kind === "app" && S.sel.i === i) rerenderKeepFocus();
  try { S.detect[i] = await api("/api/detect", { template: toFile(S.draft), server: a.server, dir: a.dir }); }
  catch (e) { S.detect[i] = { error: e.message }; }
  if (S.sel.kind === "app" && S.sel.i === i) rerenderKeepFocus();
}

async function saveAuth(i, how, useSaved) {
  const s = S.draft.servers[i], key = `${s.user}@${s.host}`;
  const body = { host: s.host, user: s.user, auth: how };
  if (how === "key") body.key_file = $(`#keyfile-${i}`)?.value || "";
  if (how === "password" && !useSaved) {
    body.password = $(`#pw-${i}`)?.value || "";
    if (!body.password) { toast("Type the password first.", true); $(`#pw-${i}`)?.focus(); return; }
  }
  try {
    const r = await api("/api/auth", body);
    S.auth[r.key] = r.auth; S.keyMode[key] = how; delete S.signin[key];
    toast(how === "key" ? "This machine signs in with the SSH key" : "Password saved on this machine");
    rerenderKeepFocus();
  } catch (e) { toast(e.message, true); }
}

async function testSignin(i) {
  const s = S.draft.servers[i], key = `${s.user}@${s.host}`;
  S.signin[key] = { busy: true }; rerenderKeepFocus();
  try { const r = await api("/api/ping", { template: toFile(S.draft), server: s.id }); S.signin[key] = { ok: r.ok, text: r.text || (r.ok ? "Signed in" : "Sign-in failed") }; }
  catch (e) { S.signin[key] = { ok: false, text: e.message }; }
  rerenderKeepFocus();
}

/* ------------------------------------------------------------------ layer, toast */
function openLayer(html) {
  $("#layer").innerHTML = `<div class="scrim" data-act="close-layer"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;
  $(".drawer [data-act=close-layer]")?.focus();
}
function closeLayer() { $("#layer").innerHTML = ""; }
let toastTimer = null;
function toast(text, bad) {
  $(".toast")?.remove();
  const el = document.createElement("div");
  el.className = `toast ${bad ? "bad" : ""}`;
  el.setAttribute("role", "status");
  el.textContent = text;
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), bad ? 6000 : 3200);
}

/* ------------------------------------------------------------------ events */
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.tagName === "TEXTAREA") { const need = el.value.split("\n").length + 1; if (need > el.rows && need <= 16) el.rows = need; }
  if (el.dataset.module !== undefined) onModule(el);
  else if (el.dataset.bind && el.tagName !== "SELECT") onBind(el);
  else if (el.dataset.local) onLocal(el);
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.bind && el.tagName === "SELECT") onBind(el);
  else if (el.dataset.bind && RERENDER_ON_BLUR.test(el.dataset.bind) && !S.wizard) requestRerender();
  else if (el.dataset.module !== undefined) requestRerender();
  if (el.dataset.act && el.type === "radio") ACT[el.dataset.act]?.(el);
});
document.addEventListener("click", (e) => {
  const sum = e.target.closest("details.more > summary");
  if (sum) S.more[sum.parentElement.dataset.more] = !sum.parentElement.open;
}, true);
document.addEventListener("focusin", (e) => { if (e.target.dataset?.step) S.lastStep = e.target; });
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act], [data-nav], [data-row-open], [data-goto], [data-open], [data-home]");
  if (!t) return;
  if (t.dataset.act && t.type === "radio") return;
  if (t.dataset.act) { e.preventDefault(); ACT[t.dataset.act]?.(t); return; }
  if (t.dataset.nav) {
    const [k, i] = t.dataset.nav.split(":");
    if (k === "app" && t.dataset.openRow) { openRow(+i, t.dataset.openRow); return; }
    S.open = {};
    select(k, i === undefined ? 0 : +i);
    if (innerWidth <= 860) $("#pane")?.scrollIntoView({ block: "start" });
    return;
  }
  if (t.dataset.rowOpen) { const [i, k] = t.dataset.rowOpen.split(":"); openRow(+i, k); return; }
  if (t.dataset.goto !== undefined) { gotoIssue(t.dataset.goto); return; }
  if (t.dataset.open) { location.hash = `#edit/${t.dataset.open}`; return; }
  if (t.dataset.home !== undefined) {
    e.preventDefault();
    if (S.dirty && !confirm("Leave this template without saving?")) return;
    S.dirty = false; S.wizard = null; location.hash = "#home"; route();
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  if (e.key === "Escape") closeLayer();
  if (e.key === "Enter" && e.target.id === "n-name") createTemplate().catch((x) => toast(x.message, true));
  if (e.key === "Enter" && S.wizard && e.target.tagName === "INPUT" && e.target.type === "text" && !e.target.dataset.step && !/^(pw|keyfile)-/.test(e.target.id)) { e.preventDefault(); wizNext(); }
});
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("hashchange", () => route());
const curTheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const THEME_ICON = {
  dark: '<svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>',
  light: '<svg class="i" viewBox="0 0 16 16"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>',
};
if (IN_CONSOLE) $("#theme").innerHTML = THEME_ICON[curTheme()];
$("#theme").addEventListener("click", () => {
  const next = curTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  if (!IN_CONSOLE) { try { localStorage.setItem("uat-deploy:theme", next); } catch {} return; }
  $("#theme").innerHTML = THEME_ICON[next];
  fetch(`/api/prefs?token=${encodeURIComponent(TOKEN)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ theme: next }) }).catch(() => {});
});

// one theme for the console and these pages: re-read it whenever the page is shown again
async function syncTheme() {
  if (!IN_CONSOLE) return;
  try {
    const t = (await (await fetch(`/api/prefs?token=${encodeURIComponent(TOKEN)}`)).json()).theme;
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    $("#theme").innerHTML = THEME_ICON[curTheme()];
  } catch {}
}
addEventListener("pageshow", syncTheme);
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncTheme(); });

/* inside the console: the same bar and the same sidebar, with Templates as the current section */
const consoleUrl = (view) => `/?token=${encodeURIComponent(TOKEN)}#/${view}`;
function consoleFrame() {
  const mark = $(".mark");
  mark.querySelector("span").textContent = "UAT console";
  mark.href = consoleUrl("apps");
  mark.removeAttribute("data-home");
  const bar = $(".bar");
  bar.insertBefore($("#theme"), null);
  const sections = [
    ["apps", "Apps", "Deploy, restart, change config", '<svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="5" rx="1.2"/><rect x="3" y="12" width="14" height="5" rx="1.2"/><path d="M6 5.5h.01M6 14.5h.01"/></svg>'],
    ["ask", "Ask UAT", "Read-only questions for Claude", '<svg viewBox="0 0 20 20"><path d="M4 4h12v9H9l-4 3v-3H4z"/><path d="M8 8.5h4"/></svg>'],
    ["activity", "Activity", "Every change made on UAT", '<svg viewBox="0 0 20 20"><path d="M4 5h12M4 10h12M4 15h8"/></svg>'],
    ["templates", "Templates", "Projects and this machine's settings", '<svg viewBox="0 0 20 20"><path d="M11 3H5v14h10V7z"/><path d="M11 3v4h4M8 11h4M8 14h4"/></svg>'],
  ];
  let foot = "";
  try { foot = sessionStorage.getItem("uat-console:servers") || ""; } catch {}
  const shell = document.createElement("div");
  shell.className = "shell";
  shell.innerHTML = `<nav class="side" aria-label="Sections"><div>${sections.map(([id, name, sub, icon]) =>
    `<a class="csec${id === "templates" ? " on" : ""}" href="${consoleUrl(id)}"${id === "templates" ? ' aria-current="page"' : ""}>${icon}<b>${name}</b><small>${sub}</small></a>`).join("")}</div>
    ${foot ? `<div class="side-foot">${foot}</div>` : ""}</nav>`;
  $("#view").before(shell);
  shell.append($("#view"));
}
if (IN_CONSOLE) consoleFrame();

function route() {
  const h = location.hash.slice(1);
  if (IN_CONSOLE && (!h || h === "home")) { S.dirty = false; location.replace(consoleUrl("templates")); return; }
  if (h.startsWith("edit/")) {
    const [id, kind, i] = h.slice(5).split("/");
    const go = () => { if (kind && ["app", "server", "overview", "instructions"].includes(kind)) select(kind, +i || 0); };
    if (S.draft && S.originalId === id) { go(); return; }
    if (S.dirty && !confirm("Leave this template without saving?")) { history.replaceState(null, "", S.originalId ? `#edit/${S.originalId}` : "#draft"); return; }
    openTemplate(id).then(go);
  } else if (h === "draft") {
    if (!S.draft) { history.replaceState(null, "", "#new"); showHome(true); }
  } else {
    if (S.draft && S.dirty && !confirm("Leave this template without saving?")) { history.replaceState(null, "", S.originalId ? `#edit/${S.originalId}` : "#draft"); return; }
    S.dirty = false;
    showHome(h === "new");
  }
}

(async () => {
  try { S.boot = await api("/api/bootstrap"); route(); }
  catch (e) { $("#view").innerHTML = `<div class="closed"><h1>Cannot reach the configurator</h1><p>${esc(e.message)}</p></div>`; }
})();
</script>
</body>
</html>
