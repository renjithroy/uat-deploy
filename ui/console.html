    <input class="inp" id="s-${esc(key)}" value="${esc(value)}" placeholder="${esc(ph || "")}" autocomplete="off" spellcheck="false"><button class="btn small">Save</button>${state ? `<span class="state${bad ? " bad" : ""}">${esc(state)}</span>` : ""}</form>`;
  const repos = su.repos.map(r => row(`Repo ${r.name}`, r.detect ? `the folder with ${r.detect}` : "", "repo." + r.name, r.path, "/path/to/your/clone", r.state === "ok" ? "" : "This folder: " + r.state, true)).join("");
  const builds = su.builds.map(b => row(b.name, "build command on this machine", "build." + b.app, b.override, b.command, b.override ? "Overrides the template's: " + b.command : "Empty: the template's command is used")).join("");
  const servers = su.servers.map(s => `<div class="setrow"><div class="k">${esc(s.label)}<small>${esc(s.target)}</small></div><div class="v">${esc(s.signIn)}</div>
    <a class="btn small" href="${cfgLink(`edit/${su.current}/server/0`)}">Change sign-in</a>${s.ready ? "" : `<span class="state bad">Nothing can reach this server until a password is saved.</span>`}</div>`).join("");
  $("#main").innerHTML = `<div class="pane"><div class="page-h"><div><h1>Templates</h1>
    <p>A template describes one project's UAT: its servers, its apps, and how each is built, deployed and checked. Templates are shared; the settings below them are this machine's only.</p></div>
    <a class="btn primary" href="${cfgLink("new")}">New template</a></div>
    <ul class="tpls">${tpls || `<li class="empty">No templates yet.</li>`}</ul>
    ${su.current ? `<section class="set"><h2>This machine</h2><p>Where your clones are, how builds run here, and how this machine signs in. Saved in your home folder, never in a template.</p>
    ${repos}${builds}${row("Local config folder", "where your local config files are", "config-dir", su.configDir, "/path/to/config-repo", "")}
    ${row("Git name", "for config commits on UAT", "git.name", su.git.name || "", "Your Name", "")}${row("Git email", "", "git.email", su.git.email || "", "you@example.com", "")}${servers}
    <div class="setrow"><div class="k">/uat-deploy opens<small>in Claude Code</small></div><div class="v"><span class="seg"><button data-mode="ui" class="${su.mode === "ui" ? "on" : ""}">This console</button><button data-mode="terminal" class="${su.mode === "terminal" ? "on" : ""}">The terminal</button></span></div><span></span></div>
    <div class="setrow"><div class="k">Claude for questions and edits</div><div class="v">${su.engine ? `Claude Code, model ${esc(su.model)}` : "Claude Code is not on this machine's PATH"}</div><span></span></div></section>` : ""}</div>`;
}

/* ---------------------------------------------------------------- activity */

async function loadActivity() {
  try { S.activity = (await api("/api/activity")).rows; } catch (e) { toast(e.message, true); S.activity = S.activity || []; }
  if (S.view.kind === "activity") renderActivity();
}

function renderActivity() {
  const rows = S.activity;
  let body;
  if (!rows) body = `<div class="loading"><span class="spin"></span></div>`;
  else {
    const apps = [...new Set(rows.map(r => r.app).filter(Boolean))];
    const shown = rows.filter(r => !S.filter || r.app === S.filter);
    let day = "", html = "";
    for (const r of shown) {
      const [d, t] = r.time.split(" ");
      if (d !== day) {
        html += `${day ? "</table>" : ""}<p class="day">${esc(new Date(d + "T00:00").toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }))}</p><table class="ledger">`;
        day = d;
      }
      const res = r.exit == null ? "" : r.exit === 0 ? "ok" : r.action === "restart" ? "failed" : "exit " + r.exit;
      html += `<tr><td class="t">${esc(t)}</td><td class="a">${esc(app(r.app)?.name || r.app || "this machine")}</td><td class="w"><b>${esc(r.action)}</b><code title="${esc(r.detail)}">${esc(r.detail)}</code></td><td class="r ${r.exit === 0 ? "ok" : "no"}">${esc(res)}</td></tr>`;
    }
    body = `<div class="filters"><button class="chip${S.filter ? "" : " on"}" data-filter="">Everything</button>${apps.map(x => `<button class="chip${S.filter === x ? " on" : ""}" data-filter="${esc(x)}">${esc(app(x)?.name || x)}</button>`).join("")}</div>`
      + (shown.length ? html + "</table>" : `<p class="empty">Nothing has been changed on UAT from this machine yet.</p>`);
  }
  $("#main").innerHTML = `<div class="pane"><div class="page-h"><div><h1>Activity</h1><p>Every change this machine made on ${esc(S.state.template.name)} UAT, newest first, from the audit log. Read-only commands are not recorded.</p></div></div>${body}</div>`;
}

/* ---------------------------------------------------------------- log drawer */

const Log = { app: "", timer: 0 };

async function openLog(id) {
  const a = app(id);
  Log.app = id;
  $("#layer").innerHTML = `<div class="scrim" data-act="closelog"></div><aside class="drawer" role="dialog" aria-label="Log of ${esc(a.name)}">
    <div class="drawer-h"><div><h3>${esc(a.name)} log</h3><code>${esc(a.log)}</code></div><label><input type="checkbox" id="logfollow"> Follow</label>
    ${S.state.engine ? `<button class="btn small" data-act="asklog">Ask about this log</button>` : ""}<button class="btn small" data-act="reloadlog">Read again</button><button class="btn small quiet" data-act="closelog">Close</button></div><pre class="out" id="logout" tabindex="0">Reading the last 300 lines…</pre></aside>`;
  await readLog();
}

async function readLog() {
  const pre = $("#logout");
  if (!pre) return;
  try {
    const r = await api(`/api/log?app=${encodeURIComponent(Log.app)}&n=300`);
    if (!$("#logout")) return;
    const stick = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60 || !pre.dataset.read;
    pre.innerHTML = r.lines.map(lineHtml).join("\n") || "The log is empty.";
    pre.dataset.read = "1";
    if (stick) pre.scrollTop = pre.scrollHeight;
  } catch (e) { pre.textContent = e.message; }
}

function closeLog() { clearInterval(Log.timer); Log.timer = 0; $("#layer").innerHTML = ""; }

/* ---------------------------------------------------------------- actions */

function validName(a, name) {
  const live = S.live[a.id] || {};
  if (!name) return "Type a name for the new file.";
  if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)) return "Use letters, digits, dots, underscores and hyphens only.";
  if (a.ext && !name.endsWith(a.ext)) return `End the name in ${a.ext}.`;
  if (name === live.activeFile) return "That is the file running now. Pick a new name; nothing on UAT is overwritten.";
  return "";
}

async function submit(key, fn) {
  if (S.busy[key]) return;
  S.busy[key] = true; if (S.view.kind === "app") renderWork();
  try { await fn(); } catch (e) { toast(e.message, true); }
  S.busy[key] = false; if (S.view.kind === "app") renderWork();
}

async function begin(path, body) {
  const r = await api(path, body);
  await loadState();
  if (r.op && !S.following.has(r.op)) follow(r.op);
  if (S.view.kind === "app") { renderHead(); renderTasks(); renderWork(); }
}

async function restartApp(id) {
  try {
    const r = await api("/api/restart", { app: id });
    await loadState();
    if (r.op && !S.following.has(r.op)) follow(r.op);
    if (S.view.kind === "app" && S.view.app === id && S.view.tab === "deploy") renderMain(); else go("app/" + id);
  } catch (e) { toast(e.message, true); }
}

document.addEventListener("submit", e => {
  e.preventDefault();
  const a = app(S.view.app), kind = e.target.dataset.form;
  if (kind === "deploy" && a) {
    const name = $("#newname").value.trim();
    S.drafts[a.id] = name;
    S.errs[a.id] = validName(a, name);
    if (S.errs[a.id]) { renderWork(); $("#newname")?.focus(); return; }
    submit("deploy", () => begin("/api/deploy", { app: a.id, name }));
  } else if (kind === "config" && a) {
    const text = $("#cfgtext").value.trim(), cfg = e.target.querySelector("input[name=cfg]:checked")?.value;
    if (!text) return $("#cfgtext").focus();
    submit("config", async () => { await begin("/api/config", { app: a.id, cfg, text }); S.cfgDraft[a.id] = ""; });
  } else if (kind === "reply" && a) {
    const op = opOf(a, "config"), t = e.target.querySelector("textarea"), text = t.value.trim();
    if (!text) return t.focus();
    submit("reply", async () => { await api("/api/config/reply", { op: op.id, text }); S.replyDraft[op.id] = ""; });
  } else if (kind === "ask") {
    askSend($("#asktext").value);
  } else if (kind === "setting") {
    const key = e.target.dataset.key;
    api("/api/setting", { key, value: e.target.querySelector("input").value }).then(su => { S.setup = su; renderTemplates(); toast("Saved"); loadState(); }).catch(err => toast(err.message, true));
  }
});

document.addEventListener("input", e => {
  const a = app(S.view.app), id = e.target.id;
  if (id === "newname") { S.drafts[a.id] = e.target.value; if (S.errs[a.id]) { S.errs[a.id] = ""; renderWork(); } }
  else if (id === "cfgtext") S.cfgDraft[a.id] = e.target.value;
  else if (id === "asktext") S.askDraft = e.target.value;
  else if (id === "replytext") { const op = opOf(a, "config"); if (op) S.replyDraft[op.id] = e.target.value; }
});

document.addEventListener("change", e => {
  if (e.target.name === "cfg") S.cfgPick[S.view.app] = e.target.value;
  else if (e.target.id === "askapp") S.askApp = e.target.value;
  else if (e.target.id === "logfollow") { clearInterval(Log.timer); Log.timer = e.target.checked ? setInterval(readLog, 4000) : 0; }
});

document.addEventListener("toggle", e => {
  const k = e.target.dataset?.fold;
  if (k) e.target.open ? S.askOpen.add(k) : S.askOpen.delete(k);
}, true);

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#layer").firstChild) closeLog();
  if (e.key === "Enter" && e.target.tagName === "TEXTAREA" && (e.metaKey || e.ctrlKey || (e.target.id === "asktext" && !e.shiftKey && !e.isComposing))) { e.preventDefault(); e.target.form?.requestSubmit(); }
});

document.addEventListener("click", e => {
  const t = e.target;
  const nav = t.closest("[data-go]");
  if (nav) { go(nav.dataset.go); return; }
  const rs = t.closest("[data-restart]");
  if (rs) { restartApp(rs.dataset.restart); return; }
  const lg = t.closest("[data-log]");
  if (lg) { openLog(lg.dataset.log); return; }
  const chip = t.closest("[data-name]");
  if (chip) { const a = app(S.view.app); S.drafts[a.id] = chip.dataset.name; S.errs[a.id] = ""; renderWork(); $("#newname")?.focus(); return; }
  const q = t.closest("[data-ask]");
  if (q) { if (/___/.test(q.dataset.ask)) fillAsk(q.dataset.ask); else if (S.view.kind === "ask") askSend(q.dataset.ask, { fresh: !!q.closest(".vitals, .asknav, .hello") }); return; }
  const fo = t.closest("[data-follow]");
  if (fo) { askSend(fo.dataset.follow); return; }
  const th = t.closest("[data-thread]");
  if (th) { go("ask/" + th.dataset.thread); return; }
  const drop = t.closest("[data-drop]");
  if (drop) { api("/api/ask/delete", { thread: drop.dataset.drop }).then(() => { if (S.askThread === drop.dataset.drop) go("ask"); else loadAsk(); }).catch(err => toast(err.message, true)); return; }
  const sv = t.closest("[data-save], [data-unsave]");
  if (sv) { api("/api/ask/save", { text: sv.dataset.save || sv.dataset.unsave, remove: !!sv.dataset.unsave }).then(r => { S.ask.saved = r.saved; renderAsk(false); }).catch(err => toast(err.message, true)); return; }
  const stp = t.closest("[data-step]");
  if (stp) { const k = stp.dataset.step; S.askOpen.has(k) ? S.askOpen.delete(k) : S.askOpen.add(k); renderAsk(false); return; }
  const cp = t.closest("[data-copy], [data-again]");
  if (cp) {
    const item = S.ask.thread?.items.find(i => i.id === +(cp.dataset.copy || cp.dataset.again).split("/")[1]);
    if (item && cp.dataset.copy) navigator.clipboard?.writeText(item.answer).then(() => toast("Copied"), () => toast("Could not copy", true));
    else if (item) askSend(item.q, { app: item.app });
    return;
  }
  const an = t.closest("[data-action]");
  if (an) { askAction(an.dataset.action); return; }
  const f = t.closest("[data-filter]");
  if (f) { S.filter = f.dataset.filter; renderActivity(); return; }
  const use = t.closest("[data-use]");
  if (use) { api("/api/use", { id: use.dataset.use }).then(() => location.reload()).catch(err => toast(err.message, true)); return; }
  const mode = t.closest("[data-mode]");
  if (mode) { api("/api/setting", { key: "mode", value: mode.dataset.mode }).then(su => { S.setup = su; renderTemplates(); toast("Saved"); }).catch(err => toast(err.message, true)); return; }
  const btn = t.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act, a = app(S.view.app), op = opOf(a, S.view.tab);
  const after = async fn => { await fn(); await loadState(); };
  if (act === "refresh") loadLive();
  else if (act === "closelog") closeLog();
  else if (act === "reloadlog") readLog();
  else if (act === "ask-stop") api("/api/ask/stop", {}).then(loadAsk);
  else if (act === "ask-new") { S.askThread = ""; if (location.hash === "#/ask") route(); else go("ask"); setTimeout(() => $("#asktext")?.focus(), 50); }
  else if (act === "asklog") askAbout(`In the ${app(Log.app).name} log, `, Log.app, false);
  else if (act === "askwhy" && op) askWhy(op, a);
  else if (!op) return;
  else if (act === "rollback") submit("rollback", () => begin("/api/rollback", { op: op.id }));
  else if (act === "revert") submit("revert", () => begin("/api/config/revert", { op: op.id }));
  else if (act === "approve") submit("approve", () => api("/api/approve", { op: op.id, digest: op.plan.digest }));
  else if (act === "restart-now" || act === "restart-later") submit("gate2", () => api("/api/config/restart", { op: op.id, go: act === "restart-now" }));
  else if (act === "cancel") submit("cancel", () => after(() => api("/api/cancel", { op: op.id })));
  else if (act === "dismiss") submit("dismiss", () => after(() => api("/api/dismiss", { op: op.id })));
});

$("#done").addEventListener("click", async () => {
  try { await api("/api/done", {}); closedPage("done"); } catch (e) { toast(e.message, true); }
});

function closedPage(why) {
  S.closed = true;
  $("#shell").innerHTML = `<div class="closed" style="grid-column: 1 / -1"><h1>${why === "done" ? "Console closed" : "The console has stopped"}</h1>
    <p>${why === "done" ? "Nothing is left running here." : "It stops after 45 minutes without an open page."} Open it again with <code>/uat-deploy</code> in Claude Code, or <code>uat console</code> in a terminal. You can close this tab.</p></div>`;
  $("#done").remove();
}

function setTheme() {
  const dark = (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  $("#theme").innerHTML = dark ? I.sun : I.moon;
  return dark;
}
$("#theme").addEventListener("click", () => {
  const next = setTheme() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  setTheme();
  api("/api/prefs", { theme: next }).catch(() => {});
});

async function syncTheme() {
  try {
    const t = (await api("/api/prefs")).theme;
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    setTheme();
  } catch {}
}
addEventListener("pageshow", syncTheme);
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncTheme(); });

function route() {
  const h = location.hash.replace(/^#\/?/, ""), parts = h.split("/");
  if (parts[0] === "app" && app(parts[1])) S.view = { kind: "app", app: parts[1], tab: parts[2] === "config" ? "config" : "deploy" };
  else if (["ask", "activity", "templates"].includes(parts[0])) { S.view = { kind: parts[0] }; if (parts[0] === "ask") S.askThread = parts[1] || ""; }
  else S.view = { kind: "apps" };
  if (S.view.kind === "activity" && !S.activity) loadActivity();
  if (S.view.kind === "ask") {
    loadAsk().then(() => { if (S.pendingAsk) { const p = S.pendingAsk; S.pendingAsk = null; askSend(p.text, { app: p.app, fresh: true }); } else if (S.askDraft) fillAsk(S.askDraft); });
    if (Date.now() - S.vitalsAt > 30000) { S.vitalsAt = Date.now(); loadVitals(); }
  }
  if (S.view.kind === "templates") loadSetup();
  lastRunning = "";
  renderSections(); renderMain();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

(async () => {
  setTheme();
  await loadState();
  if (!S.state) return;
  route();
  loadLive();
  setInterval(tick, 1000);
  setInterval(() => { if (!S.closed) loadState(); }, 15000);
  setInterval(() => { if (!S.closed && !document.hidden && Date.now() - S.liveAt > 55000) loadLive(); }, 60000);
})();
</script>
</body>
